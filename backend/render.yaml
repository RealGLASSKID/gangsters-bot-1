# Render Blueprint — backend only.
# Dashboard: New + Blueprint and connect this repo, or create a Web Service manually
# with Root Directory = backend.
#
# Free instances sleep after ~15 minutes idle. Point UptimeRobot at /health every 5 minutes.
# WhatsApp auth + SQLite live under DATA_DIR. Attach a disk (paid) if you cannot re-scan QR
# after every deploy/restart.

services:
  - type: web
    name: gangster-bot-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: DASHBOARD_DEV_BYPASS
        value: "0"
      - key: OWNER_JID
        sync: false
      - key: GROUP_JID
        sync: false
      - key: BOT_NAME
        value: GANGSTER BOT
      - key: PREFIX
        value: "!"
      - key: SUPER_ADMIN_PHONES
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: FIREBASE_ADMIN_EMAILS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
